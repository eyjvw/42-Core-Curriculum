services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: app_nginx
    ports:
      - "8443:443"
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/config/Dockerfile
    container_name: app_gateway
    env_file:
      - ./gateway/.env
    environment:
      NODE_ENV: production
    depends_on:
      auth:
        condition: service_healthy
      social:
        condition: service_healthy
      game:
        condition: service_healthy
    command: bun run src/index.ts
    volumes:
      - ./gateway/src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/config/Dockerfile
    container_name: app_front
    env_file:
      - ./frontend/.env
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: backend/auth/config/Dockerfile
    container_name: app_auth
    env_file:
      - ./backend/auth/.env
    environment:
      NODE_ENV: production
    command: bun run src/index.ts
    volumes:
      - ./backend/auth/src:/app/src
      - ./backend/db:/app/db
      - sqlite-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  social:
    build:
      context: .
      dockerfile: backend/social/config/Dockerfile
    container_name: app_social
    env_file:
      - ./backend/social/.env
    environment:
      NODE_ENV: production
    command: bun run src/index.ts
    volumes:
      - ./backend/social/src:/app/src
      - ./backend/db:/app/db
      - sqlite-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  game:
    build:
      context: .
      dockerfile: backend/game/config/Dockerfile
    container_name: app_game
    env_file:
      - ./backend/game/.env
    environment:
      NODE_ENV: production
    command: bun run src/index.ts
    volumes:
      - ./backend/game/src:/app/src
      - ./backend/db:/app/db
      - sqlite-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sqlite-data:
