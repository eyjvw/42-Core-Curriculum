<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Static Site</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .card { max-width: 720px; width: 100%; border: 1px solid #ddd; border-radius: 16px; padding: 2rem; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Static Site</h1>
      <p>Ce site statique est servi par Nginx, sans PHP.</p>
    </div>
  </main>
</body>
</html>
