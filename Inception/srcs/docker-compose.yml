services:
  nginx:
    build: ./requirements/nginx/.
    image: nginx:inception
    container_name: nginx
    depends_on:
      - wp-php
      - mariadb
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - web:/var/www/html
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
  wp-php:
    build: ./requirements/wordpress/.
    image: wp-php:inception
    container_name: wp-php
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - web:/var/www/html
    networks:
      - inception
    env_file: ".env"
    restart: unless-stopped
    secrets:
      - db_pass
      - db_root_pass
      - db_redis_pass
  mariadb:
    build: requirements/mariadb/.
    image: mariadb:inception
    container_name: mariadb
    networks:
      - inception
    volumes:
      - db:/var/lib/mysql
    env_file: ".env"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    secrets:
      - db_pass
      - db_root_pass
  ftp:
    build: requirements/ftp/.
    image: ftp:inception
    container_name: ftp
    networks:
      - inception
    volumes:
      - web:/var/www/html
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    env_file: ".env"
    restart: unless-stopped
    secrets:
      - ftp_password
  redis:
    build: requirements/redis/.
    image: redis:inception
    container_name: redis
    networks:
      - inception
    restart: unless-stopped
    secrets:
      - db_redis_pass
  adminer:
    build: ./requirements/adminer/.
    image: adminer:inception
    container_name: adminer
    depends_on:
      - mariadb
    networks:
      - inception
    ports:
      - "8080:8080"
    restart: unless-stopped
  static:
    build: ./requirements/static/.
    image: static:inception
    container_name: static
    networks:
      - inception
    ports:
      - "8081:80"
    restart: unless-stopped
  fail2ban:
    build: ./requirements/fail2ban/.
    image: fail2ban:inception
    container_name: fail2ban
    depends_on:
      - nginx
    network_mode: "service:nginx"
    volumes:
      - nginx_logs:/var/log/nginx:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

volumes:
  db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/sbonneau/data/db
  web:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/sbonneau/data/web
  nginx_logs:
    driver: local

networks:
  inception:

secrets:
  db_pass:
    file: ../secrets/db_pass.txt
  db_root_pass:
    file: ../secrets/db_root_pass.txt
  ftp_password:
    file: ../secrets/db_ftp_pass.txt
  db_redis_pass:
    file: ../secrets/db_redis_pass.txt
